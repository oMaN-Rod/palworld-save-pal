name: CI

on:
  push:
    branches: [main, v1.3.x]
  pull_request:

# Superseded PR runs are cancelled; main-branch pushes stay serialized.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # rust-cache's recommendation: smaller cache snapshots, faster saves.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-ci"

      - name: ps-app stays transport-free
        shell: bash
        run: |
          if ! tree_output=$(cargo tree -p ps-app -e normal); then
            echo "::error::cargo tree failed to run for ps-app; dependency guard could not verify anything"
            exit 1
          fi
          if echo "$tree_output" | grep -E "axum|rfd|opener|bollard|sysinfo|reqwest|tower-http|clap|sqlx"; then
            echo "::error::forbidden native dependency in ps-app tree"
            exit 1
          fi

      - name: ps-db core compiles without sqlx
        run: cargo check -p ps-db --no-default-features

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Core crates compile for wasm32
        run: cargo check --target wasm32-unknown-unknown --no-default-features -p ps-core -p ps-db -p ps-app -p ps-lua-sys -p ps-plugin

      - name: ps-web builds for wasm32
        run: cargo build --target wasm32-unknown-unknown -p ps-web -j 2

      - name: Test workspace
        run: cargo test --workspace

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # setup-bun caches the bun executable only; the package cache (monaco,
      # three, maplibre, playwright...) would otherwise re-download every run.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-ci-${{ runner.os }}-${{ hashFiles('ps-ui/bun.lock', 'signal-broker/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: ps-ui
        run: bun install --frozen-lockfile

      # Named files, not the whole suite: the rest of it has failures that
      # predate this workflow and would drown anything a change here breaks.
      - name: Signal frontend tests
        working-directory: ps-ui
        run: bunx vitest run src/lib/signal/crypto.test.ts src/lib/signal/session.test.ts src/lib/components/map/features/liveActorFC.test.ts

      - name: Install broker dependencies
        working-directory: signal-broker
        run: bun install --frozen-lockfile

      - name: Broker tests
        working-directory: signal-broker
        run: bun run test

      - name: Desktop web build succeeds
        working-directory: ps-ui
        run: bun run build
