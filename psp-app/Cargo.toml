[package]
name = "psp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `test_support` to downstream crates' tests (psp-server), the way
# psp-core's `test-fixtures` does.
test-support = ["dep:tempfile", "psp-db/sqlx-driver"]

[dependencies]
psp-core = { workspace = true }
psp-db = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
psp-core = { path = "../psp-core", features = ["test-fixtures"] }
psp-db = { workspace = true, features = ["sqlx-driver"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
