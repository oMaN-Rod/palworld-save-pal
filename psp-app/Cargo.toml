[package]
name = "psp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `test_support` to downstream crates' tests (psp-server), the way
# psp-core's `test-fixtures` does.
test-support = ["dep:tempfile", "psp-db/sqlx-driver"]

[dependencies]
psp-core = { workspace = true }
psp-db = { workspace = true, default-features = false }
psp-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true, optional = true }

# `blocking::run_blocking` uses `tokio::task::spawn_blocking` (rt) natively;
# wasm32 has no blocking pool and keeps the sync-only feature set above.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
psp-core = { path = "../psp-core", features = ["test-fixtures"] }
psp-db = { workspace = true, features = ["sqlx-driver"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# The integration tests link psp-app as an external crate, so `cfg(test)` does
# not reach it; this is what makes the `test_support` surface visible to them.
psp-app = { path = ".", features = ["test-support"] }
