[package]
name = "ps-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PalStudio HTTP/WebSocket server: axum backend serving the web UI and save-editing API"
repository = "https://github.com/oMaN-Rod/palworld-save-pal"

[features]
# Desktop-only native file dialogs (rfd). Off by default so the server/Docker
# build stays headless — rfd's Linux backend (ashpd) pulls wayland system libs.
# ps-desktop enables it.
desktop = ["dep:rfd"]
# UPnP port mapping for the Network page (off = the toggle reports
# "unsupported build"). On by default: ps-server only builds for native
# targets where igd-next is harmless.
default = ["upnp"]
upnp = ["ps-network/upnp"]

[dependencies]
ps-app = { workspace = true }
ps-core = { workspace = true, features = ["oodle"] }
ps-db = { workspace = true, features = ["sqlx-driver"] }
ps-network = { workspace = true }
ps-plugin = { workspace = true }
uesave = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true }
futures = { workspace = true }
percent-encoding = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rfd = { workspace = true, optional = true }
opener = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
sysinfo = { workspace = true }
futures-util = { workspace = true }
bollard = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
webrtc = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
sqlx = { workspace = true }
ps-app = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
ps-core = { path = "../ps-core", features = ["test-fixtures"] }
