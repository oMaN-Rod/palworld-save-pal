[package]
name = "psp-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# The package stays `psp-desktop` (workspace members, `-p psp-desktop`, the
# Dockerfile and CI working-dirs all key off it); only the emitted binary is
# `psp`. Keep this in step with `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "psp"
path = "src/main.rs"

[features]
default = []

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
psp-server = { path = "../psp-server", features = ["desktop"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Linux launcher only: opening the system browser (`opener`), tray icon decode
# (`image`), and a detached relaunch (`libc::setsid`). Inert on Windows/macOS,
# where `webview_app` runs and none of these are reached at runtime.
opener = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"