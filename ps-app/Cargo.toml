[package]
name = "ps-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PalStudio application services: use-cases over the save-editing core"
repository = "https://github.com/oMaN-Rod/palworld-save-pal"

[features]
# Exposes `test_support` to downstream crates' tests (ps-server), the way
# ps-core's `test-fixtures` does.
test-support = ["dep:tempfile", "ps-db/sqlx-driver"]

[dependencies]
ps-core = { workspace = true }
ps-db = { workspace = true, default-features = false }
ps-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true, optional = true }

# `blocking::run_blocking` uses `tokio::task::spawn_blocking` (rt) natively;
# wasm32 has no blocking pool and keeps the sync-only feature set above.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
ps-core = { path = "../ps-core", features = ["test-fixtures"] }
ps-db = { workspace = true, features = ["sqlx-driver"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# The integration tests link ps-app as an external crate, so `cfg(test)` does
# not reach it; this is what makes the `test_support` surface visible to them.
ps-app = { path = ".", features = ["test-support"] }
