[workspace]
resolver = "2"
members = ["ps-core", "ps-db", "ps-app", "ps-server", "ps-desktop", "ps-web", "ps-lua-sys", "ps-plugin", "ps-network", "palstudio"]

[workspace.package]
# Single source of truth for the project version (get_version, Tauri bundle,
# all crates). Bump with scripts/bump.ps1.
version = "1.5.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Thin LTO shrinks every release artifact (desktop installers, Docker image,
# wasm); codegen-units = 1 trades a slower release build for size/speed.
# Symbols are deliberately NOT stripped: a stripped desktop build reports
# panics without a backtrace, and crash reports are how save-corruption bugs
# get found.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
ps-app = { path = "ps-app" }
ps-core = { path = "ps-core", default-features = false }
# Sqlx-free by default so ps-app's normal tree stays platform-agnostic;
# crates that need the SqlxSqliteDriver opt in with `features = ["sqlx-driver"]`.
ps-db = { path = "ps-db", default-features = false }
ps-lua-sys = { path = "ps-lua-sys" }
ps-network = { path = "ps-network" }
ps-plugin = { path = "ps-plugin" }
ps-server = { path = "ps-server" }
# Vendored copies lived here for the (since-removed) crates.io publishing
# channel; the fork carries the pluggable-game-support changes and its
# `oodle` feature pulls in the Oodle codec from the ooz repo transitively.
uesave = { git = "https://github.com/oMaN-Rod/uesave-rs.git", branch = "pluggable-game-support", default-features = false }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate", "json", "chrono"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
cityhasher = "0.1"         # CityHash64: the hash Palworld saves use for container keys
indexmap = "2"             # uesave's Properties map, for borrowed-key lookups
futures = "0.3"
percent-encoding = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
opener = "0.7"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
bollard = "0.18"
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.33"
sha2 = "0.10"
ring = "0.17"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.11"
rand = "0.9"
flate2 = "1"
tar = "0.4"
async-trait = "0.1"
webrtc = "=0.20.4"
futures-util = "0.3"
# dev-dependencies
tokio-tungstenite = "0.24"
tempfile = "3"
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
