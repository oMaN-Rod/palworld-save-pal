[package]
name = "ps-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
uesave = { workspace = true, features = ["gvas-json"] }
chrono = { workspace = true }
tracing = { workspace = true }
cityhasher = { workspace = true }
indexmap = { workspace = true }
ruzstd = { workspace = true }
brotli = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
# The integration tests link ps-core as an external crate, so `cfg(test)` does
# not reach it; this is what makes the `test-fixtures` surface visible to them.
ps-core = { path = ".", features = ["test-fixtures"] }

[features]
default = ["oodle"]
# Pulls uesave's C++ ooz-rs Oodle codec. OFF for wasm32: ooz-rs compiles 11 C++
# files against libstdc++, which wasm32-unknown-unknown has no toolchain for.
oodle = ["uesave/oodle"]
test-fixtures = []
