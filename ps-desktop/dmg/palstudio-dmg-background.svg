<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">PalStudio macOS installer background</title>
  <desc id="desc">A dark navy, blue and violet installer background matching the PalStudio desktop app.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1d"/>
      <stop offset="0.52" stop-color="#101a36"/>
      <stop offset="1" stop-color="#170f2b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ba7ff" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f56da8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56a6ff"/>
      <stop offset="0.55" stop-color="#9c72ff"/>
      <stop offset="1" stop-color="#ef78b5"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.06" cy="0.07" r="0.85">
      <stop offset="0" stop-color="#2d8dff" stop-opacity="0.3"/>
      <stop offset="0.52" stop-color="#2d8dff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0.96" cy="0.98" r="0.8">
      <stop offset="0" stop-color="#e95dba" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#9b5cff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#82b9ff" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#9bc9ff" fill-opacity="0.11"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="smallBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9e9ff"/>
    </marker>
  </defs>

  <rect width="860" height="520" rx="14" fill="url(#base)"/>
  <rect width="860" height="520" rx="14" fill="url(#blueGlow)"/>
  <rect width="860" height="520" rx="14" fill="url(#pinkGlow)"/>
  <rect width="860" height="520" rx="14" fill="url(#grid)"/>
  <rect width="860" height="520" rx="14" fill="url(#dots)" opacity="0.46"/>

  <circle cx="92" cy="80" r="140" fill="#4d9cff" opacity="0.08" filter="url(#softBlur)"/>
  <circle cx="794" cy="458" r="150" fill="#cf63db" opacity="0.1" filter="url(#softBlur)"/>
  <circle cx="430" cy="308" r="78" fill="#5c8dff" opacity="0.08" filter="url(#smallBlur)"/>

  <rect x="20" y="20" width="820" height="480" rx="10" fill="none" stroke="url(#edge)" stroke-opacity="0.42"/>
  <path d="M 48 154 H 812" stroke="#94bfff" stroke-opacity="0.14"/>
  <path d="M 48 452 H 812" stroke="#94bfff" stroke-opacity="0.12"/>
  <path d="M 48 154 V 122" stroke="#59a7ff" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M 812 452 V 420" stroke="#e676b6" stroke-opacity="0.65" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <text x="52" y="70" fill="#f6f9ff" font-size="29" font-weight="700" letter-spacing="7">PALSTUDIO</text>
    <text x="54" y="99" fill="#a9c7ef" font-size="12" font-weight="500" letter-spacing="2.6">PALWORLD SAVE EDITOR</text>
    <rect x="638" y="48" width="164" height="26" rx="13" fill="#8bbaff" fill-opacity="0.09" stroke="#8bbaff" stroke-opacity="0.24"/>
    <circle cx="654" cy="61" r="3" fill="#6db1ff"/>
    <text x="665" y="65" fill="#b8d5fb" font-size="9" font-weight="600" letter-spacing="1.25">MACOS EDITION</text>

    <text x="52" y="138" fill="#6ea9f4" font-size="10" font-weight="700" letter-spacing="2">INSTALL IN TWO STEPS</text>
    <text x="52" y="484" fill="#8fa9cf" font-size="10" font-weight="500" letter-spacing="1.8">DRAG PALSTUDIO TO APPLICATIONS</text>
    <text x="808" y="484" text-anchor="end" fill="#657da6" font-size="9" font-weight="600" letter-spacing="1.2">SAVE • EDIT • RESTORE</text>
  </g>

  <g opacity="0.34" fill="none" stroke="#83baff">
    <circle cx="220" cy="302" r="70" stroke-opacity="0.28" stroke-dasharray="2 8"/>
    <circle cx="640" cy="302" r="70" stroke-opacity="0.2" stroke-dasharray="2 8"/>
    <path d="M 220 222 V 238 M 220 366 V 382 M 140 302 H 156 M 284 302 H 300" stroke-opacity="0.34"/>
    <path d="M 640 222 V 238 M 640 366 V 382 M 560 302 H 576 M 704 302 H 720" stroke-opacity="0.26"/>
  </g>

  <g fill="#b9d8ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">
    <text x="220" y="406" text-anchor="middle" opacity="0.48">PALSTUDIO</text>
    <text x="640" y="406" text-anchor="middle" opacity="0.42">APPLICATIONS</text>
  </g>

  <g fill="none" stroke="#cfe4ff" stroke-linecap="round">
    <path d="M 320 302 C 350 278, 370 278, 398 302" stroke="#62aaff" stroke-width="2.5" stroke-opacity="0.58"/>
    <path d="M 462 302 C 490 278, 510 278, 540 302" stroke="#bb86ff" stroke-width="2.5" stroke-opacity="0.58" marker-end="url(#arrowHead)"/>
    <path d="M 398 302 H 462" stroke="url(#accent)" stroke-width="2" stroke-dasharray="3 6" stroke-opacity="0.78"/>
  </g>
  <circle cx="430" cy="302" r="4" fill="#e0ecff"/>
  <circle cx="430" cy="302" r="12" fill="none" stroke="#8ebfff" stroke-opacity="0.22"/>
</svg>
