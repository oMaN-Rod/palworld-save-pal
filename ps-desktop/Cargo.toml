[package]
name = "ps-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

# The package stays `ps-desktop` (workspace members, `-p ps-desktop`, the
# Dockerfile and CI working-dirs all key off it); only the emitted binary is
# `palstudio`. Keep this in step with `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "palstudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
ps-server = { path = "../ps-server", features = ["desktop"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
