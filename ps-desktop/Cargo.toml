[package]
name = "ps-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PalStudio desktop app (Tauri shell around the embedded server)"
repository = "https://github.com/oMaN-Rod/palworld-save-pal"
# Not publishable: the Tauri bundle resources (ui_build/, data/) are built by
# bun + the release workflow, not `cargo install`.
publish = false

# The package stays `ps-desktop` (workspace members, `-p ps-desktop`, the
# Dockerfile and CI working-dirs all key off it). The cargo output is
# `palstudio-desktop` so it can coexist with the `palstudio` launcher crate's
# binary in one target dir; tauri-cli renames it to `mainBinaryName`
# (`palstudio`) inside every bundle it packages.
[[bin]]
name = "palstudio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
ps-server = { path = "../ps-server", features = ["desktop"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
