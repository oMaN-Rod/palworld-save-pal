[package]
name = "psp-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Size-focused wasm-opt pass for the browser bundle (default is just `-O`);
# the engine is parse-bound, not compute-bound, so `-Oz` wins on download size.
# The --enable flags spell out the wasm features rustc emits; older cached
# Binaryen builds (v117, which wasm-pack may reuse locally) don't auto-detect
# them, and newer ones accept the explicit set unchanged.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--strip-debug",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
    "--enable-mutable-globals",
    "--enable-multivalue",
]

[dependencies]
psp-app = { workspace = true }
psp-core = { workspace = true }
psp-db = { workspace = true }
# `AppState` holds `tokio::sync::{watch,mpsc,Mutex}`; these channels/primitives
# need no runtime, so they work on wasm32.
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
async-trait = { workspace = true }
uuid = { workspace = true }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
base64 = { workspace = true }
