[package]
name = "psp-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
uesave = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
cityhasher = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The integration tests link psp-core as an external crate, so `cfg(test)` does
# not reach it; this is what makes the `test-fixtures` surface visible to them.
psp-core = { path = ".", features = ["test-fixtures"] }

[features]
test-fixtures = []
