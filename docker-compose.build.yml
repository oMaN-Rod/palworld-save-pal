# Build override for docker-compose.yml: builds the image locally instead of
# pulling the prebuilt one. The SPA dials its websocket same-origin, so no
# address needs baking — it works from any host/port the container is
# published on. (Set PUBLIC_WS_URL only to pin a different backend.)
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# scripts/build-docker.sh / .ps1 run exactly this.
services:
  palstudio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
