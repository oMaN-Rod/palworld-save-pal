# Build override for docker-compose.yml: builds the image locally so
# PUBLIC_WS_URL can point at this machine's IP for browsers on the LAN.
#
#   PUBLIC_WS_URL=192.168.1.20:5174/ws \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# scripts/build-docker.sh / .ps1 run exactly this with the IP auto-detected.
services:
  palstudio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_WS_URL: ${PUBLIC_WS_URL:-127.0.0.1:5174/ws}
